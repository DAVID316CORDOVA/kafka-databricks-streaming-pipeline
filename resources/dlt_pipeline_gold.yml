resources:
  pipelines:
    trades_gold_pipeline:
      name: trades_gold_pipeline

      catalog: ${var.catalog}
      target: ${var.gold_schema}

      continuous: false
      photon: false

      clusters:
        - label: default
          # Same reasoning as Silver's pipeline: pinned to a VM size
          # already proven available, running single-node.
          node_type_id: "Standard_D4s_v3"
          num_workers: 0
          spark_conf:
            spark.databricks.cluster.profile: singleNode
            spark.master: "local[*]"
          custom_tags:
            ResourceClass: SingleNode

      libraries:
        - notebook:
            path: ../notebooks/gold_trades_dlt.py

      configuration:
        pipelines.enableTrackHistory: "true"
        # Same pattern as Silver's bronze_catalog/bronze_schema: read via
        # spark.conf.get(...) inside the notebook instead of a hardcoded
        # table path, so this pipeline correctly finds Silver's real
        # location (dev_silver vs. silver) per environment.
        upstream_silver_catalog: ${var.catalog}
        upstream_silver_schema: ${var.silver_schema}