resources:
  pipelines:
    trades_gold_pipeline:
      name: trades_gold_pipeline

      catalog: ${var.catalog}
      target: ${var.gold_schema}

      continuous: false
      photon: false

      clusters:
        - label: default
          node_type_id: "Standard_D4s_v3"  # mismo valor que en dlt_pipeline_silver.yml
          num_workers: 0
          spark_conf:
            spark.databricks.cluster.profile: singleNode
            spark.master: "local[*]"
          custom_tags:
            ResourceClass: SingleNode

      libraries:
        - notebook:
            path: ../notebooks/gold_trades_dlt.py

      configuration:
        pipelines.enableTrackHistory: "true"
        upstream_silver_catalog: ${var.catalog}
        upstream_silver_schema: ${var.silver_schema}