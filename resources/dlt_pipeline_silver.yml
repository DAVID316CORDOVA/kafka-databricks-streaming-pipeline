resources:
  pipelines:
    trades_silver_pipeline:
      name: trades_silver_pipeline

      # El catalogo y el schema de destino se toman de variables del bundle.
      # El mismo archivo sirve para dev y para prod sin modificarse: solo
      # cambia el valor de silver_schema segun el target activo con el que
      # se despliegue.
      catalog: ${var.catalog}
      target: ${var.silver_schema}

      # continuous: false -> el pipeline corre una vez y se detiene (modo
      # "triggered"). Se dispara manualmente cuando se quiera practicar,
      # en vez de dejarlo corriendo de forma indefinida.
      continuous: false
      photon: false

      clusters:
        - label: default
          # Se fuerza el mismo node_type_id que fintech-cleaning-cluster,
          # porque ese tamaño de VM ya está confirmado disponible dentro de
          # la cuota de la suscripcion de Azure. El default automatico de
          # DLT eligio un tamano no disponible (QuotaExceeded).
          node_type_id: "Standard_D4s_v3"  # confirmado: mismo tamano que fintech-cleaning-cluster
          num_workers: 0  # single-node: reduce el consumo total de vCPUs
          spark_conf:
            spark.databricks.cluster.profile: singleNode
            spark.master: "local[*]"
          custom_tags:
            ResourceClass: SingleNode

      libraries:
        - notebook:
            path: ../notebooks/silver_trades_dlt.py

      configuration:
        pipelines.enableTrackHistory: "true"
        bronze_catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}