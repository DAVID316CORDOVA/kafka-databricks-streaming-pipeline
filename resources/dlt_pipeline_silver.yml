resources:
  pipelines:
    trades_silver_pipeline:
      name: trades_silver_pipeline

      # Destination catalog/schema, pulled from bundle variables -- this
      # is what makes the exact same file deploy to dev_silver in dev and
      # silver in prod, with no per-environment duplication.
      catalog: ${var.catalog}
      target: ${var.silver_schema}

      # Triggered mode: runs once over whatever is currently available
      # upstream, then stops and releases its cluster on its own. No idle
      # compute risk, unlike the Bronze job above.
      continuous: false
      photon: false

      clusters:
        - label: default
          # Pinned to the same VM size as the existing interactive
          # cluster (proven available in this Azure subscription's
          # quota). DLT's own auto-selected default size hit a
          # QuotaExceeded error during setup, unrelated to the pipeline
          # code itself.
          node_type_id: "Standard_D4s_v3"
          # Single-node: pay for exactly one VM instead of a
          # driver+workers split. num_workers: 0 alone isn't enough --
          # DLT also requires the spark_conf/custom_tags below to
          # actually provision as single-node; without them it emits a
          # "Single node cluster is not correctly configured" warning.
          num_workers: 0
          spark_conf:
            spark.databricks.cluster.profile: singleNode
            spark.master: "local[*]"
          custom_tags:
            ResourceClass: SingleNode

      libraries:
        - notebook:
            path: ../notebooks/silver_trades_dlt.py

      configuration:
        pipelines.enableTrackHistory: "true"
        # Read inside the notebook via spark.conf.get(...), NOT
        # hardcoded as a table name. This is what lets the same Silver
        # notebook correctly resolve Bronze's real location
        # (kafka_bronze in dev, bronze in prod) without any code
        # branching. Hardcoding this once caused a TABLE_OR_VIEW_NOT_FOUND
        # failure when the pipeline ran against dev with a prod-shaped
        # table name baked in.
        bronze_catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}