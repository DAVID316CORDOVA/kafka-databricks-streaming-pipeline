bundle:
  name: kafka_streaming_pipeline

variables:
  # Catalogo de Unity Catalog donde viven todas las tablas del proyecto.
  # Se reutiliza el catalogo del proyecto fintech porque ya cuenta con una
  # External Location configurada y funcional.
  catalog:
    default: dbw_fintech_fdcg01

  # Schema de la capa Bronze (datos crudos desde Kafka, sin transformar).
  bronze_schema:
    default: kafka_bronze

  # Schema exclusivo de la capa Silver (tabla trades_clean).
  silver_schema:
    default: silver

  # Schema exclusivo de la capa Gold (tabla trades_ohlc_1min).
  gold_schema:
    default: gold

  # Nombre del topic de Kafka que lee el consumer de Bronze.
  kafka_topic:
    default: trades-stream

  # Direccion del broker de Kafka (host:puerto). Sin default de forma
  # intencional: el broker corre en un EC2 de AWS con IP publica fija, y
  # esa direccion se pasa como variable de entorno al momento del deploy,
  # para no dejarla hardcodeada dentro del repositorio:
  #   BUNDLE_VAR_kafka_bootstrap_servers="54.242.249.122:9092"
  kafka_bootstrap_servers:
    description: "Direccion publica del broker de Kafka en el EC2 (host:puerto)"

  # Controla desde donde arranca a leer el job de Bronze la PRIMERA vez.
  # dev: "earliest" -- ya tienes historial generado, quieres reprocesarlo.
  # prod: "latest" -- evita releer el backlog completo (seria carisimo);
  # solo captura trades nuevos a partir del momento del deploy.
  starting_offsets:
    default: "earliest"

  # ID del cluster interactivo (classic, no serverless) que ejecuta el job
  # de streaming de Bronze. Se usa un cluster ya existente en vez de uno
  # nuevo porque asi lo requiere este workspace. El ID se obtiene de la URL
  # del cluster en la UI: .../compute/clusters/<ESTE-ID>
  existing_cluster_id:
    description: "ID del cluster clasico interactivo a usar para el job de Bronze"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405618306957518.18.azuredatabricks.net
    variables:
      # Nota: bronze_schema tiene tambien un default general arriba. Las
      # dos apariciones deben coincidir en valor, o el deploy termina
      # apuntando a un schema distinto al que espera el notebook.
      bronze_schema: kafka_bronze
      silver_schema: dev_silver
      gold_schema: dev_gold

  prod:
    mode: production
    workspace:
      host: https://adb-7405618306957518.18.azuredatabricks.net
      root_path: /Workspace/Users/felix.david.cordova.garcia@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      starting_offsets: "latest"

# Se cargan automaticamente todos los archivos de recursos (jobs,
# pipelines) que esten dentro de resources/, sin necesidad de listarlos
# uno por uno en este archivo.
include:
  - resources/*.yml