bundle:
  name: kafka_streaming_pipeline

variables:
  # Unity Catalog catalog where every table in this project lives (bronze,
  # silver, gold). Reused from the fintech project because it already has
  # a working External Location configured.
  catalog:
    default: dbw_fintech_fdcg01

  # Bronze layer schema (raw, unparsed-beyond-schema data from Kafka).
  bronze_schema:
    default: kafka_bronze

  # Silver layer schema (trades_clean table).
  silver_schema:
    default: silver

  # Gold layer schema (trades_ohlc_1min table).
  gold_schema:
    default: gold

  # Kafka topic the Bronze consumer reads from.
  kafka_topic:
    default: trades-stream

  # Broker address (host:port). No default on purpose: the broker runs on
  # an EC2 with a non-Elastic public IP, so it can change on instance
  # restart. Forcing it to be passed explicitly (via env var locally, via
  # GitHub Secret in CI) avoids a stale hardcoded value being silently
  # reused after the IP changes:
  #   BUNDLE_VAR_kafka_bootstrap_servers="<ip>:9092"
  kafka_bootstrap_servers:
    description: "Public address of the Kafka broker on EC2 (host:port)"

  # ID of the existing classic interactive cluster used by the Bronze job.
  # An existing cluster is reused instead of a new one because this
  # workspace requires it that way. Found in the cluster's URL in the UI:
  # .../compute/clusters/<THIS-ID>
  existing_cluster_id:
    description: "ID of the classic interactive cluster used for the Bronze job"

  # Controls where the Bronze job starts reading from on its VERY FIRST
  # run in a given environment (later runs always resume from the
  # checkpoint, regardless of this value).
  # dev:  "earliest" -- there's already a generated history worth keeping.
  # prod: "latest"   -- avoids re-ingesting the entire Kafka backlog on
  #                     first deploy, which would be slow and wasteful.
  starting_offsets:
    default: "earliest"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405618306957518.18.azuredatabricks.net
    variables:
      # NOTE: bronze_schema also has a general default above. Both
      # occurrences must match, or the deploy silently ends up pointing
      # at a schema the notebook doesn't expect.
      bronze_schema: kafka_bronze
      silver_schema: dev_silver
      gold_schema: dev_gold
      starting_offsets: "earliest"

  prod:
    mode: production
    workspace:
      host: https://adb-7405618306957518.18.azuredatabricks.net
      # Required because the CI/CD service principal (terraform-sp)
      # deploys as itself, not as a human user with a default home
      # folder -- this gives it an explicit, predictable path.
      root_path: /Workspace/Users/felix.david.cordova.garcia@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      starting_offsets: "latest"

# Wildcard, not a manual list: any new file dropped into resources/ is
# picked up automatically on the next deploy, no edit needed here.
include:
  - resources/*.yml